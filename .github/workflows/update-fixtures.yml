name: Spielplan aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"   # taeglich um 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Spielplan abrufen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/fetch_fixtures.py

      - name: Vereinsliste fuer die Suche abrufen
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/fetch_teams.py

      - name: Private Kalender-Feeds pro Nutzer bauen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/generate_calendar.py

      - name: Aenderungen committen (nur falls es welche gibt)
        run: |
          git config user.name "kickwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fixtures.json data/teams.json data/calendar/
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am Spielplan."
          else
            git commit -m "Spielplan-Update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Falls zwischenzeitlich (z.B. durch einen manuellen Push) neue
            # Commits auf main gelandet sind, einmal rebasen und erneut
            # versuchen, statt den ganzen Lauf an einem einfachen
            # "fetch first"-Konflikt scheitern zu lassen.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push fehlgeschlagen (Versuch $attempt), rebase auf origin/main und erneut versuchen..."
              git fetch origin main
              git rebase origin/main
            done
          fi
